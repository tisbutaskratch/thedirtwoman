# Netlify build config for the frontend (apps/web).
#
# TWO Netlify sites are created from this one repo and this one branch. They
# share this file and differ only in environment variables, set per site in
# Site settings -> Environment variables:
#
#   Resume site (e.g. sabawilhelm.com)
#     VITE_SITE          unset, or "resume"
#     VITE_PLANNER_URL   https://<planner domain>
#     VITE_API_BASE_URL  https://<api host>
#
#   Planner site (e.g. thedirthags.com)
#     VITE_SITE          planner
#     VITE_RESUME_URL    https://<resume domain>
#     VITE_API_BASE_URL  https://<api host>
#
# Each site ships only its own routes (see apps/web/src/lib/site.ts), so the
# resume bundle carries no planner code and vice versa. Both redeploy on
# every push to main.
#
# Only the planner talks to the API; every resume page renders from
# compile-time data. So Render's CORS_ORIGINS needs the planner origin only,
# and the resume site needs no VITE_API_BASE_URL. See DEPLOY.md.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

# Single-page app: every path is served index.html and routed client side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
