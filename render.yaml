# Render Blueprint for the API — https://render.com/docs/blueprint-spec
#
# Deploy: New + -> Blueprint, connect this repo. Full walkthrough in
# DEPLOY.md at the repo root.
#
# The frontend isn't here: both sites deploy to Netlify from netlify.toml.
services:
  - type: web
    name: adventure-planner-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    # Free web services sleep after 15 minutes idle and take about a minute to
    # wake. Change to starter before putting this link on a resume.
    plan: free
    # Migrations run from the Dockerfile's CMD, not preDeployCommand, so this
    # deploys on any instance type. See apps/api/Dockerfile.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adventure-planner-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      # Invite links are built from this. Left at its default it emails
      # people a localhost URL, so it has to be the real site.
      - key: FRONTEND_BASE_URL
        sync: false

databases:
  - name: adventure-planner-db
    plan: free
    databaseName: adventure_planner
    user: adventure_planner
